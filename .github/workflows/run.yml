name: Limbus News Bot

on:
  schedule:
    # every 30 min (UTC time)
    - cron: '*/30 * * * *'
  workflow_dispatch: # 允許手動觸發測試

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run script
      env:
        # 這一行是關鍵：將 GitHub 的秘密載入為環境變數
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      
      run: python main.py

    - name: Commit and push if ID changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # 檢查是否有檔案變動，避免空提交報錯
        git pull origin main
        if git status --porcelain LASTFILE.txt | grep -q 'M'; then
          echo "🔥 偵測到 last_link.txt 有更新，準備提交回儲存庫..."
          git add LASTFILE.txt
          git commit -m "Update last news ID"
          git push origin main
        else
          # 如果檔案沒變（沒有新推文），就印出這行，優雅地結束，絕對不報錯
          echo "😴 last_link.txt 沒有任何變動，跳過 Commit。"
        fi
        
        if [ -f last_new_id.txt ]; then
          git add last_new_id.txt
          git commit -m "chore: update last steam GID [skip ci]" || echo "No changes to commit"
          git push
        fi
     